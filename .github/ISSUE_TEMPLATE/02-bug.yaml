name: "バグ報告"
description: "バグを報告する"
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どんなバグが発生しているか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: バグを再現するための手順を記述してください
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来どう動くべきか
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際にはどう動いたか
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 発生頻度
      options:
        - 常に発生
        - 時々発生
        - 一度だけ発生
        - 不明
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット
      description: エラーログやスクリーンショットがあれば添付してください
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 発生環境を記述してください
      value: |
        - OS:
        - ブラウザ / バージョン:
        - Go:
    validations:
      required: false
